[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Shadrous/rugkit"
authors = ["The rugkit contributors"]
publish = false

[workspace.dependencies]
rugkit-render = { path = "crates/rugkit-render", version = "0.0.0" }
rugkit-shell = { path = "crates/rugkit-shell", version = "0.0.0" }
rugkit-reactive = { path = "crates/rugkit-reactive", version = "0.0.0" }
rugkit-layout = { path = "crates/rugkit-layout", version = "0.0.0" }
rugkit-widgets = { path = "crates/rugkit-widgets", version = "0.0.0" }

vello = "0.12"
parley = "0.13"
winit = "0.30.13"
pollster = "1.0"
log = "0.4"
slotmap = "1.1"
taffy = { version = "0.16", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "NSColor", "NSColorSpace"] }
accesskit = "0.25"
accesskit_winit = "0.34"
muda = "0.22"
arboard = { version = "3.7", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
